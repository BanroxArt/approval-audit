[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "approvalaudit"
version = "0.1.0"
description = "Read-only audit of ERC-20, ERC-721 and Permit2 token approvals, and a decoder for EIP-2612 and Permit2 signature requests before signing. Engineering checklist, not legal advice."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Art Akopian", email = "opensource@banrox.com" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["ethereum", "erc20", "permit2", "eip-2612", "approval-phishing", "wallet-drainer", "stablecoin", "fraud"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "hypothesis>=6.100"]

[project.urls]
Homepage = "https://banrox.com"
Source = "https://github.com/BanroxArt/approval-audit"

[project.scripts]
approvalaudit = "approvalaudit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
approvalaudit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true
